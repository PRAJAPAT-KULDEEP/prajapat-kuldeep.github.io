name: Weekly website performance check

on:
  workflow_dispatch:
  schedule:
    # Weekly on Tuesday at 03:20 UTC (08:50 IST).
    - cron: "20 3 * * 2"

permissions:
  contents: read

concurrency:
  group: website-performance-monitor
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Lighthouse CI labels its uploaded report with the current commit; without a checkout
      # that step failed ("Unable to determine current hash with `git rev-parse HEAD`").
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run Lighthouse on key pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://prajapat-kuldeep.github.io/
            https://prajapat-kuldeep.github.io/research/
            https://prajapat-kuldeep.github.io/publications/
            https://prajapat-kuldeep.github.io/vlog/what-is-a-cluster/
            https://prajapat-kuldeep.github.io/gallery/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
